version: "3.8"

services:
  frontend:
    image: 960177448694.dkr.ecr.sa-east-1.amazonaws.com/home-app-frontend:v58
    restart: always
    networks:
      - app-network

  backend:
    image: 960177448694.dkr.ecr.sa-east-1.amazonaws.com/home-app-backend:v58
    ports:
      - "8001:8001"
    restart: always
    env_file:
      - .env
    volumes:
      - /home/ubuntu/.aws:/root/.aws:ro
      - /home/ubuntu/HOME/server/cache:/app/cache
    networks:
      - app-network

  frontend_proxy:
    build:
      context: /home/ubuntu/HOME
      dockerfile: apache/Dockerfile.frontend
    container_name: frontend_proxy
    ports:
      - "443:443"
    volumes:
      - ./apache/apache-frontend.conf:/usr/local/apache2/conf/extra/apache-frontend.conf:ro
      - /etc/ssl/certs/wrrm_lat.crt:/etc/ssl/certs/wrrm_lat.crt:ro
      - /etc/ssl/private/wrrm_lat.key:/etc/ssl/private/wrrm_lat.key:ro
      - /etc/ssl/certs/wrrm_lat.ca-bundle:/etc/ssl/certs/wrrm_lat.ca-bundle:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
