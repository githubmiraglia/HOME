<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MAME_NEW – Test Harness</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            text-align: center;
        }

        #controls {
            margin: 20px;
        }

        #mame-container {
            width: 960px;
            height: 720px;
            margin: 0 auto;
            border: 2px solid #444;
            background: black;
        }

        select, button {
            font-size: 16px;
            margin: 5px;
            padding: 6px 12px;
        }
    </style>
</head>

<body>

<h1>MAME_NEW – Minimal Test Page</h1>

<div id="controls">
    <select id="romSelector"></select>
    <button onclick="runSelectedROM()">RUN</button>
    <button onclick="stopMAME()">STOP</button>
</div>

<div id="mame-container"></div>

<!-- ================= MAME CORE ================= -->
<script src="../MAME/mamejs/mamejs.js"></script>

<script>
/* ================= GLOBALS ================= */

let loadedMame = null;
let config = null;

/* ================= CONFIG ================= */

window.onload = function () {

    const games = {
        files: {
            "dkong.zip": "../MAME/roms/dkong.zip",
            "elevator.zip": "../MAME/roms/elevator.zip",
            "mk.zip": "../MAME/roms/mk.zip"
        },
        driver: {
            "dkong.zip": "dkong",
            "elevator.zip": "elevator",
            "mk.zip": "mk"
        }
    };

    config = {
        emulator: "../MAME/mamejs/mame.js",
        games: games,
        resolution: {
            width: 448,
            height: 576
        }
    };

    populateROMSelector(games);
    preloadMAME(config);
};

/* ================= INIT ================= */

function populateROMSelector(games) {
    const sel = document.getElementById("romSelector");
    sel.innerHTML = "";

    Object.keys(games.files).forEach((rom) => {
        const opt = document.createElement("option");
        opt.value = rom;
        opt.textContent = rom;
        sel.appendChild(opt);
    });
}

function preloadMAME(config) {
    const container = document.getElementById("mame-container");

    mamejs.load(config.emulator, container)
        .then((mame) => {
            loadedMame = mame;
            console.log("MAME core loaded");

            return mame.loadRoms(config.games.files);
        })
        .then(() => {
            console.log("All ROMs loaded");
        })
        .catch((err) => {
            console.error("MAME preload error:", err);
        });
}

/* ================= RUN / STOP ================= */

function runSelectedROM() {
    if (!loadedMame) {
        console.error("MAME not loaded yet");
        return;
    }

    const rom = document.getElementById("romSelector").value;
    const driver = config.games.driver[rom];

    if (!driver) {
        console.error("No driver for ROM:", rom);
        return;
    }

    console.log("Running:", rom, "->", driver);

    loadedMame
        .runGame(driver, config.resolution)
        .then(() => console.log("Game running"))
        .catch((err) => console.error("Run error:", err));
}

function stopMAME() {
    if (!loadedMame) return;

    try {
        loadedMame.loader.module.ccall("exit", "void", ["number"], [0]);
        console.log("MAME exited");
    } catch (e) {
        console.warn("Exit ignored:", e.message);
    }
}
</script>

</body>
</html>
