<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WRRM Hub</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e6e6e6;
        background-image: radial-gradient(#d0d0d0 1px, transparent 1px);
        background-size: 6px 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        display: flex;
        gap: 80px;
    }

    .card {
        width: 350px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .card img {
        width: 100%;
        border-radius: 12px;
        border: 2px solid #ccc;
    }

    .title {
        margin-top: 15px;
        font-size: 28px;
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>

<div class="container">

    <div class="card" onclick="location.href='/family-gallery'">
        <img src="family.png" alt="Family Gallery">
        <div class="title">Family Gallery</div>
    </div>

    <div class="card" onclick="location.href='/dmp'">
        <img src="arcade.png" alt="DMP Arcade">
        <div class="title">DMP Arcade</div>
    </div>

</div>

</body>
</html>
